MODEL:
  NAME: CVAE
  PRETRAIN: CLIPreidNew  # CLIPreid or CLIPreidNew or CLIPreidFinetune
  FEAT_FUSION: True
  LATENT_SIZE: 64  # 12, 36, 64
  FEATURE_DIM: 1280 # 768 for TransReID and 1280 for CLIPreid
  # ENCODER_LAYER_SIZES: [1280, 256]  # should be from 1280 to 12 
  # DECODER_LAYER_SIZES: [256, 1280]
  ZC_DIM: 128  # ori 128
  ZS_DIM: 64
  STYLE_NUM: 0

TRAIN:
  MAX_EPOCH: 30
  OPTIMIZER:
    LR: 1e-3   # 1-e4 for MLP and Linear  # 
    WEIGHT_DECAY: 1e-4  #  5e-4 for MLP and Linear  
    
  LR_SCHEDULER: 
    STEPSIZE: [10]

DATA:
  NUM_INSTANCES: 4
  TRAIN_BATCH: 64

LOSS:
  PAIR_LOSS: triplet_wrt
  PAIR_M: 0.3
TEST:
  START_EVAL: 4
  EVAL_STEP: 1
TAG: clipreid_simplevae_base