MODEL:
  NAME: CVAE
  PRETRAIN: CLIPreID_Tune_MSMT17  # CLIPreid or CLIPreidNew or CLIPreidFinetune
  LATENT_SIZE: 64  # 12, 36, 64
  FEATURE_DIM: 1280 # 768 for TransReID and 1280 for CLIPreid
  ZC_DIM: 128  # ori 128
  ZS_DIM: 64
  STYLE_NUM: 0

TRAIN:
  MAX_EPOCH: 60
  OPTIMIZER:
    LR: 1e-3
    # 1e-4 for stage 1 and 1e-3 for stage2
    # 0.0001*10 = 0.001
    # 0.0001*5 = 0.0005 = 5e-4
  LR_SCHEDULER: 
    STEPSIZE: [30]

DATA:
  NUM_INSTANCES: 4
  TRAIN_BATCH: 64

LOSS:
  PAIR_LOSS: triplet_wrt
  PAIR_M: 0.3
TEST:
  START_EVAL: -1
TAG: clipreid_simplevae_base